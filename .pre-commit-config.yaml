# Hooks that fix files (whitespace, final newlines, BOMs, line endings, dotnet format,
# PSScriptAnalyzer) rewrite them and fail; on a pull request, pre-commit.ci lite then
# commits those fixes to the PR (the pre-commit job in .github/workflows/build.yml, which
# runs before the builds). The check-* hooks, detect-private-key and actionlint can only
# report. Hook revs are bumped by Dependabot.
repos:
  # General hygiene hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^Windows-Hinting/Resources/netsparkle_pub\.txt$
      - id: end-of-file-fixer
        # NuGet writes lock files without a final newline and rewrites them on restore
        exclude: ^Windows-Hinting/Resources/netsparkle_pub\.txt$|(^|/)packages\.lock\.json$
      # .editorconfig: charset = utf-8 (no BOM)
      - id: fix-byte-order-marker
        exclude: ^Windows-Hinting/Resources/netsparkle_pub\.txt$
      - id: check-yaml
      - id: check-json
      - id: check-xml
        # MSBuild/WiX project and source files are XML too
        files: \.(xml|csproj|wixproj|props|targets|pubxml|slnx|wxs|wxl|manifest)$
        types: [file]
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: detect-private-key
      - id: mixed-line-ending
        args: ['--fix=crlf']
        exclude: ^Windows-Hinting/Resources/netsparkle_pub\.txt$

  # GitHub Actions workflow linting (also runs shellcheck on bash run: blocks when available).
  # actionlint's own hook: pre-commit builds it from source with Go (installing Go itself
  # if needed). Pinned to the tag's commit; the comment is the tag (pre-commit's --freeze
  # format, which Dependabot keeps updated).
  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
    hooks:
      - id: actionlint

  # C# whitespace formatting per .editorconfig. --folder formats the files directly,
  # without loading the project, so it needs no restore or build and stays fast.
  - repo: local
    hooks:
      - id: dotnet-format
        name: dotnet format whitespace
        entry: dotnet format whitespace --folder --include
        language: system
        types_or: [c#]
        pass_filenames: true

  # PowerShell: PSScriptAnalyzer's automatic fixes, then a report of what's left
  - repo: local
    hooks:
      - id: psscriptanalyzer
        name: PSScriptAnalyzer
        entry: pwsh -NoProfile -File build/Invoke-PSScriptAnalyzer.ps1
        language: system
        files: \.ps1$
        pass_filenames: true
