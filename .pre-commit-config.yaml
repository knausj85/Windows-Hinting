# Hooks that fix files (whitespace, final newlines, BOMs, line endings, dotnet format,
# PSScriptAnalyzer) rewrite them and fail; on a pull request, pre-commit.ci lite then
# commits those fixes to the PR (.github/workflows/pre-commit.yml). The check-* hooks,
# detect-private-key and actionlint can only report. Hook revs are bumped by Dependabot.
repos:
  # General hygiene hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^Windows-Hinting/Resources/netsparkle_pub\.txt$
      - id: end-of-file-fixer
        exclude: ^Windows-Hinting/Resources/netsparkle_pub\.txt$
      # .editorconfig: charset = utf-8 (no BOM)
      - id: fix-byte-order-marker
        exclude: ^Windows-Hinting/Resources/netsparkle_pub\.txt$
      - id: check-yaml
      - id: check-json
      - id: check-xml
        # MSBuild/WiX project and source files are XML too
        files: \.(xml|csproj|wixproj|props|targets|pubxml|slnx|wxs|wxl|manifest)$
        types: [file]
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: detect-private-key
      - id: mixed-line-ending
        args: ['--fix=crlf']
        exclude: ^Windows-Hinting/Resources/netsparkle_pub\.txt$

  # GitHub Actions workflow linting (also runs shellcheck on bash run: blocks when available)
  - repo: https://github.com/Mateusz-Grzelinski/actionlint-py
    rev: v1.7.12.25
    hooks:
      - id: actionlint

  # C# whitespace formatting per .editorconfig. --folder formats the files directly,
  # without loading the project, so it needs no restore or build and stays fast.
  - repo: local
    hooks:
      - id: dotnet-format
        name: dotnet format whitespace
        entry: dotnet format whitespace --folder --include
        language: system
        types_or: [c#]
        pass_filenames: true

  # PowerShell: PSScriptAnalyzer's automatic fixes, then a report of what's left
  - repo: local
    hooks:
      - id: psscriptanalyzer
        name: PSScriptAnalyzer
        entry: pwsh -NoProfile -File build/Invoke-PSScriptAnalyzer.ps1
        language: system
        files: \.ps1$
        pass_filenames: true
