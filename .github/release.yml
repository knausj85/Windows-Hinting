# Shapes GitHub's generated release notes, which also become the in-app update
# notes for stable releases (see "Generate release notes" in workflows/build.yml).
# Each entry is a merged PR's title, so write titles for users.
# https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes
changelog:
  exclude:
    labels:
      - skip-changelog
      - documentation
      # Planning/exploration work (wayfinder skill), not user-facing changes
      - wayfinder:map
      - wayfinder:research
      - wayfinder:grilling
      - wayfinder:prototype
    authors:
      - dependabot
      - dependabot[bot]
  categories:
    - title: New features
      labels:
        - enhancement
    - title: Fixes
      labels:
        - bug
    - title: Other changes
      labels:
        - "*"
