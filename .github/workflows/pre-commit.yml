name: pre-commit

# Runs the hooks in .pre-commit-config.yaml and, on pull requests, has pre-commit.ci lite
# push whatever the fixing hooks changed (whitespace, line endings, final newlines, BOMs,
# dotnet format, PSScriptAnalyzer) back to the PR branch as one commit.
#
# This is pre-commit.ci *lite* rather than the hosted pre-commit.ci service because the
# hosted runners are Linux-only with no network at hook time, so they can't run the
# dotnet-format (.NET 10 SDK) or PSScriptAnalyzer (pwsh) hooks. Lite runs inside this
# Windows job instead, so every hook can autofix. Hook versions are kept current by
# Dependabot (.github/dependabot.yml, pre-commit ecosystem).
#
# Requires the pre-commit.ci lite GitHub App on this repository:
#   https://github.com/apps/pre-commit-ci-lite/installations/new
# The app reads this workflow's run and pushes the fix commit; the job itself only needs
# read access. It doesn't push fixes for commits made by bots.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: pre-commit
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      # For the dotnet-format hook (whitespace --folder: no restore needed).
      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser

      # Fails if any hook changed a file or reported a problem; the diff is in the log.
      - name: Run pre-commit
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

      # Must be the last step, and its name must contain "pre-commit-ci-lite" (the app
      # finds the run by it). Uploads the hooks' changes for the app to commit to the PR.
      - name: pre-commit-ci-lite autofix
        uses: pre-commit-ci/lite-action@062bca0919bc9d6e66755cc05074b70c77e111fc # v1.2.0
        if: always()
        with:
          msg: 'style: apply pre-commit fixes [pre-commit.ci lite]'
