name: Build

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

env:
  BUILD_VERSION: 0.1.${{ github.run_number }}

defaults:
  run:
    shell: pwsh

jobs:
  lint:
    name: Pre-commit Lint
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore NuGet packages
        run: dotnet restore

      - name: Install PSScriptAnalyzer
        run: Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

      - name: Auto-fix and commit
        if: failure() && github.event_name == 'pull_request'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto-fix pre-commit hook violations"

  build-debug:
    name: Debug Build
    needs: lint
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Restore NuGet packages
        run: dotnet restore

      - name: Build Debug (exe only)
        run: build\build-complete.bat Debug --exe-only

      - name: Clean Debug output
        run: |
          $outDir = "Windows-Hinting\bin\Debug\net8.0-windows"
          Remove-Item "$outDir\xunit.*" -Force -ErrorAction SilentlyContinue

      - name: Upload Debug artifact
        uses: actions/upload-artifact@v7
        with:
          name: Windows-Hinting-Debug
          path: Windows-Hinting\bin\Debug\net8.0-windows\
          if-no-files-found: error

  build-release:
    name: Release Build + MSI
    needs: lint
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3

      - name: Install WiX Toolset
        # Version must match WixToolset.Sdk version in Windows-Hinting.Installer.wixproj
        run: dotnet tool install --global wix --version 6.0.2

      - name: Restore NuGet packages
        run: dotnet restore

      - name: Build Release exe
        run: .\build\build-complete.ps1 -Configuration Release -ExeOnly

      - name: Stage Release binaries for signing
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          $outDir   = "$env:GITHUB_WORKSPACE\Windows-Hinting\bin\Release\net8.0-windows"
          $stageDir = "$env:GITHUB_WORKSPACE\to_be_signed_release"
          New-Item -ItemType Directory -Path $stageDir -Force | Out-Null
          Get-ChildItem -LiteralPath $stageDir -Force | Remove-Item -Recurse -Force
          foreach ($name in @('Windows-Hinting.exe','Windows-Hinting.dll')) {
            $src = Join-Path $outDir $name
            if (-not (Test-Path -LiteralPath $src)) { throw "File to sign not found: $src" }
            Copy-Item -LiteralPath $src -Destination (Join-Path $stageDir $name) -Force
          }
          Write-Host "Staged files for signing:"
          Get-ChildItem -LiteralPath $stageDir | ForEach-Object { Write-Host "  - $($_.Name)" }

      - name: Sign Release binaries with SSL.com eSigner
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: sslcom/esigner-codesign@develop
        with:
          command: batch_sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          dir_path: ${GITHUB_WORKSPACE}\to_be_signed_release
          output_path: ${GITHUB_WORKSPACE}\Windows-Hinting\bin\Release\net8.0-windows
          malware_block: true

      - name: Verify Release signatures and clean staging
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          $outDir   = "$env:GITHUB_WORKSPACE\Windows-Hinting\bin\Release\net8.0-windows"
          $stageDir = "$env:GITHUB_WORKSPACE\to_be_signed_release"
          Write-Host "--- Release Signature verification ---"
          foreach ($name in @('Windows-Hinting.exe','Windows-Hinting.dll')) {
            $dest = Join-Path $outDir $name
            if (-not (Test-Path -LiteralPath $dest)) {
              Write-Host "  ERROR: signed file missing: $dest"
              continue
            }
            $sig = Get-AuthenticodeSignature -FilePath $dest
            Write-Host "  File         : $dest"
            Write-Host "    Status       : $($sig.Status)"
            Write-Host "    StatusMessage: $($sig.StatusMessage)"
            if ($sig.SignerCertificate) {
              Write-Host "    Signer       : $($sig.SignerCertificate.Subject)"
              Write-Host "    Valid until  : $($sig.SignerCertificate.NotAfter)"
            } else {
              Write-Host "    Signer       : (none - file is unsigned)"
            }
          }
          Write-Host "--------------------------------------"
          Remove-Item -LiteralPath $stageDir -Recurse -Force -ErrorAction SilentlyContinue

      - name: Verify signatures BEFORE MSI build
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          $outDir = "$env:GITHUB_WORKSPACE\Windows-Hinting\bin\Release\net8.0-windows"
          Write-Host "--- Pre-MSI signature check ---"
          foreach ($name in @('Windows-Hinting.exe','Windows-Hinting.dll')) {
            $dest = Join-Path $outDir $name
            $sig  = Get-AuthenticodeSignature -FilePath $dest
            Write-Host "  $name : $($sig.Status) ($($sig.StatusMessage))"
            if ($sig.Status -ne 'Valid') {
              throw "Pre-MSI verification failed: $name is not validly signed (status: $($sig.Status))."
            }
          }
          Write-Host "-------------------------------"

      - name: Build MSI (packages the signed binaries)
        run: |
          # IMPORTANT: /p:BuildProjectReferences=false so msbuild does NOT rebuild the
          # Windows-Hinting project via its ProjectReference. Rebuilding would overwrite
          # the already-signed Windows-Hinting.exe / Windows-Hinting.dll with fresh
          # unsigned outputs, and WiX would then harvest those unsigned files into the MSI
          # (the signed MSI would contain an unsigned managed DLL).
          $InstallerProject = "Windows-Hinting.Installer\Windows-Hinting.Installer.wixproj"
          msbuild $InstallerProject `
            /p:Configuration=Release `
            /p:SignOutput=false `
            /p:BuildProjectReferences=false `
            /nologo /v:minimal

      - name: Verify signatures AFTER MSI build
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          $outDir = "$env:GITHUB_WORKSPACE\Windows-Hinting\bin\Release\net8.0-windows"
          Write-Host "--- Post-MSI signature check ---"
          $failed = $false
          foreach ($name in @('Windows-Hinting.exe','Windows-Hinting.dll')) {
            $dest = Join-Path $outDir $name
            $sig  = Get-AuthenticodeSignature -FilePath $dest
            Write-Host "  $name : $($sig.Status) ($($sig.StatusMessage))"
            if ($sig.Status -ne 'Valid') {
              Write-Host "    ERROR: $name was stripped/overwritten during MSI build."
              $failed = $true
            }
          }
          Write-Host "--------------------------------"
          if ($failed) {
            throw "MSI build overwrote signed binaries. Check that /p:BuildProjectReferences=false is honored."
          }

      - name: Sign MSI with SSL.com eSigner
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: sslcom/esigner-codesign@develop
        with:
          command: sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          file_path: ${GITHUB_WORKSPACE}\Windows-Hinting.Installer\bin\Release\en-US\Windows-Hinting.msi
          malware_block: true
          override: true

      - name: Verify MSI signature
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          $msiPath = "$env:GITHUB_WORKSPACE\Windows-Hinting.Installer\bin\Release\en-US\Windows-Hinting.msi"
          Write-Host "--- MSI Signature verification ---"
          if (-not (Test-Path $msiPath)) {
            Write-Host "  ERROR: MSI not found at $msiPath"
          } else {
            $sig = Get-AuthenticodeSignature -FilePath $msiPath
            Write-Host "  Status       : $($sig.Status)"
            Write-Host "  StatusMessage: $($sig.StatusMessage)"
            if ($sig.SignerCertificate) {
              Write-Host "  Signer       : $($sig.SignerCertificate.Subject)"
              Write-Host "  Valid until  : $($sig.SignerCertificate.NotAfter)"
            } else {
              Write-Host "  Signer       : (none — MSI is unsigned)"
            }
          }
          Write-Host "----------------------------------"

      - name: Build portable Release exe (UIAccess disabled)
        run: |
          # The MSI build above has already consumed/signed Windows-Hinting\bin\Release
          # and its matching obj\. Remove them so they don't collide with the portable
          # build's auto-generated AssemblyInfo / AssemblyAttributes files (CS0579).
          $project = "Windows-Hinting\Windows-Hinting.csproj"
          Remove-Item "$env:GITHUB_WORKSPACE\Windows-Hinting\bin" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "$env:GITHUB_WORKSPACE\Windows-Hinting\obj" -Recurse -Force -ErrorAction SilentlyContinue

          # Build Release configuration into a separate output path, overriding the manifest
          # to disable UIAccess so the binary can run without being installed to a trusted location.
          $baseOutput = "$env:GITHUB_WORKSPACE\Windows-Hinting\bin-portable\"
          $baseInt    = "$env:GITHUB_WORKSPACE\Windows-Hinting\obj-portable\"
          msbuild $project `
            /p:Configuration=Release `
            /p:ApplicationManifest=app.debug.manifest `
            /p:BaseOutputPath=$baseOutput `
            /p:BaseIntermediateOutputPath=$baseInt `
            /restore `
            /nologo /v:minimal
          if ($LASTEXITCODE -ne 0) { throw "Portable Release build failed with exit code $LASTEXITCODE" }
          # Prune xunit test binaries that get pulled into bin\ output.
          $portableOut = Join-Path $baseOutput "Release\net8.0-windows"
          Remove-Item "$portableOut\xunit.*" -Force -ErrorAction SilentlyContinue

      - name: Stage portable binaries for signing
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          $outDir   = "$env:GITHUB_WORKSPACE\Windows-Hinting\bin-portable\Release\net8.0-windows"
          $stageDir = "$env:GITHUB_WORKSPACE\to_be_signed_portable"
          New-Item -ItemType Directory -Path $stageDir -Force | Out-Null
          Get-ChildItem -LiteralPath $stageDir -Force | Remove-Item -Recurse -Force
          foreach ($name in @('Windows-Hinting.exe','Windows-Hinting.dll')) {
            $src = Join-Path $outDir $name
            if (-not (Test-Path -LiteralPath $src)) { throw "File to sign not found: $src" }
            Copy-Item -LiteralPath $src -Destination (Join-Path $stageDir $name) -Force
          }
          Write-Host "Staged portable files for signing:"
          Get-ChildItem -LiteralPath $stageDir | ForEach-Object { Write-Host "  - $($_.Name)" }

      - name: Sign portable binaries with SSL.com eSigner
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: sslcom/esigner-codesign@develop
        with:
          command: batch_sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          dir_path: ${GITHUB_WORKSPACE}\to_be_signed_portable
          output_path: ${GITHUB_WORKSPACE}\Windows-Hinting\bin-portable\Release\net8.0-windows
          malware_block: true

      - name: Verify portable signatures and clean staging
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          $outDir   = "$env:GITHUB_WORKSPACE\Windows-Hinting\bin-portable\Release\net8.0-windows"
          $stageDir = "$env:GITHUB_WORKSPACE\to_be_signed_portable"
          Write-Host "--- Portable Signature verification ---"
          foreach ($name in @('Windows-Hinting.exe','Windows-Hinting.dll')) {
            $dest = Join-Path $outDir $name
            if (-not (Test-Path -LiteralPath $dest)) {
              Write-Host "  ERROR: signed file missing: $dest"
              continue
            }
            $sig = Get-AuthenticodeSignature -FilePath $dest
            Write-Host "  File         : $dest"
            Write-Host "    Status       : $($sig.Status)"
            Write-Host "    StatusMessage: $($sig.StatusMessage)"
            if ($sig.SignerCertificate) {
              Write-Host "    Signer       : $($sig.SignerCertificate.Subject)"
              Write-Host "    Valid until  : $($sig.SignerCertificate.NotAfter)"
            } else {
              Write-Host "    Signer       : (none - file is unsigned)"
            }
          }
          Write-Host "---------------------------------------"
          Remove-Item -LiteralPath $stageDir -Recurse -Force -ErrorAction SilentlyContinue

      - name: Create portable zip
        run: |
          $portableOut = "$env:GITHUB_WORKSPACE\Windows-Hinting\bin-portable\Release\net8.0-windows"
          $zipPath     = "$env:GITHUB_WORKSPACE\Windows-Hinting-Portable.zip"
          if (Test-Path -LiteralPath $zipPath) { Remove-Item -LiteralPath $zipPath -Force }
          Compress-Archive -Path "$portableOut\*" -DestinationPath $zipPath
          Write-Host "Portable zip created: $zipPath"

      - name: Upload Portable artifact
        uses: actions/upload-artifact@v7
        with:
          name: Windows-Hinting-Portable
          path: Windows-Hinting-Portable.zip
          if-no-files-found: error

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v7
        with:
          name: Windows-Hinting-Installer
          path: Windows-Hinting.Installer\bin\Release\en-US\Windows-Hinting.msi
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-debug, build-release]
    # Only publish a release on direct pushes to main — not PRs or other branches
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Download Debug build
        uses: actions/download-artifact@v8
        with:
          name: Windows-Hinting-Debug
          path: artifacts/Windows-Hinting-Debug

      - name: Zip Debug build
        run: cd artifacts && zip -r Windows-Hinting-Debug.zip Windows-Hinting-Debug/

      - name: Download Portable build
        uses: actions/download-artifact@v8
        with:
          name: Windows-Hinting-Portable
          path: artifacts

      - name: Download MSI installer
        uses: actions/download-artifact@v8
        with:
          name: Windows-Hinting-Installer
          path: artifacts

      - name: Create GitHub release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ env.BUILD_VERSION }}
          name: v${{ env.BUILD_VERSION }}
          generateReleaseNotes: true
          makeLatest: true
          body: |
            ## Downloads

              | Asset | Description |
              |---|---|
              | **Windows-Hinting-Portable.zip** | Portable Release build — signed `Windows-Hinting.exe` and `Windows-Hinting.dll`. No UIAccess (hints won't appear above e.g. the start menu). Extract and run `Windows-Hinting.exe`. Requires [.NET 8 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/8.0). |
              | **Windows-Hinting-Debug.zip** | Debug build — **unsigned**, for diagnostics/testing only. Extract and run `Windows-Hinting.exe`. Requires [.NET 8 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/8.0). |
              | **Windows-Hinting.msi** | Installer — fully signed (installer, executable, and managed DLL). Provides UIAccess support so hints appear above e.g. the start menu. |
          artifacts: |
            artifacts/Windows-Hinting-Debug.zip
            artifacts/Windows-Hinting-Portable.zip
            artifacts/Windows-Hinting.msi
