name: Build

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:
    inputs:
      sign_binaries:
        description: "Sign Release/Portable/MSI binaries with SSL.com eSigner (implied by publish_release)"
        type: boolean
        default: false
      publish_release:
        description: "Sign and publish a GitHub Release (main => stable 'v<ver>' tag; other branches => rolling 'beta' tag)"
        type: boolean
        default: false
      prerelease:
        description: "Mark the published release as prerelease (ignored for beta, which is always a prerelease)"
        type: boolean
        default: false

# Third-party actions are pinned to full commit SHAs (the comment is the ref the SHA
# was taken from) so a moved tag or branch can't change what runs with the signing secrets.
# Jobs get read-only access unless they need more (see the release job).
permissions:
  contents: read

env:
  BUILD_VERSION: 0.1.${{ github.run_number }}

concurrency:
  # Manual runs (which sign and publish) get their own group, so a push can't cancel a
  # release between deleting the old beta and creating the new one, and always run to
  # completion. A newer push or PR update supersedes an in-flight CI build, main included:
  # pushes only build, so nothing is lost.
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && '-release' || '' }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

defaults:
  run:
    shell: pwsh

jobs:
  # GitHub starts one workflow run per event, so a push to a branch with an open PR
  # starts two runs (push and pull_request) for the same commit. Only one should work:
  # the pull_request run, because it is the one pre-commit.ci lite can autofix and it
  # also covers PRs from forks. This job ends the push run early when the branch has an
  # open PR (draft or not) that can be merged; everything else needs it and is skipped. Pushes to main,
  # pushes to branches without a PR (after about a minute of waiting for one), PR runs
  # and manual runs all proceed.
  gate:
    name: Run gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Check for an open pull request
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          run=true
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_NAME" != "main" ]; then
            # A PR is often opened right after the branch's first push (git push, then
            # gh pr create), after this job has already looked. Keep looking for ~1 minute
            # so that push run is skipped too, instead of building alongside the PR run.
            prs=
            for attempt in $(seq 7); do
              prs=$(gh api "repos/$GITHUB_REPOSITORY/pulls?state=open&head=$OWNER:$GITHUB_REF_NAME" --jq '.[].number')
              [ -n "$prs" ] && break
              if [ "$attempt" -lt 7 ]; then sleep 10; fi
            done
            for pr in $prs; do
              # GitHub only starts a pull_request run when the PR can be merged (it builds
              # the merge commit), so a PR with conflicts would leave this commit unbuilt.
              # Mergeability is computed after the push; wait up to ~1 minute for it.
              mergeable=null
              for _ in $(seq 12); do
                mergeable=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq '.mergeable')
                [ "$mergeable" != "null" ] && break
                sleep 5
              done
              if [ "$mergeable" = "true" ]; then
                echo "Branch has open PR #$pr; its pull_request run lints and builds this commit."
                run=false
                break
              fi
              echo "PR #$pr isn't mergeable (mergeable=$mergeable), so it gets no pull_request run; building here."
            done
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
  # Runs first: the build jobs wait for it, so a commit that fails formatting or lint
  # doesn't spend ~10 runner-minutes building. On a pull request, the last step has
  # pre-commit.ci lite commit whatever the fixing hooks changed (whitespace, line endings,
  # final newlines, BOMs, dotnet format, PSScriptAnalyzer) back to the PR branch; the
  # builds are skipped for the failing commit and run on the fixed one.
  #
  # pre-commit.ci lite rather than the hosted service: hosted runners are Linux-only with
  # no network at hook time and only .NET SDK 7, so the dotnet-format and PSScriptAnalyzer
  # hooks couldn't run there. Lite works inside this Windows job. It needs the GitHub App:
  #   https://github.com/apps/pre-commit-ci-lite/installations/new
  # and requires this job to be the last one still running when there's something to fix,
  # which holds because every other job that could still be running depends on it.
  # Hook revs are bumped by Dependabot (.github/dependabot.yml).
  pre-commit:
    name: pre-commit
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: .github/requirements-pre-commit.txt

      # Pinned in a requirements file so Dependabot (pip) can bump it.
      - name: Install pre-commit
        run: python -m pip install -r .github/requirements-pre-commit.txt

      - name: Cache pre-commit environments
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      # For the dotnet-format hook (whitespace --folder: no restore needed).
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # Pinned so a new analyzer release can't turn CI red without a repo change.
      - name: Install PSScriptAnalyzer
        run: Install-Module -Name PSScriptAnalyzer -RequiredVersion 1.25.0 -Force -Scope CurrentUser

      # Fails if any hook changed a file or reported a problem; the diff is in the log.
      - name: Run pre-commit
        run: pre-commit run --all-files --show-diff-on-failure --color=always

      # Must be the last step, and its name must contain "pre-commit-ci-lite" (the app
      # finds the run by it). Does nothing outside pull requests or when nothing changed.
      - name: pre-commit-ci-lite autofix
        uses: pre-commit-ci/lite-action@062bca0919bc9d6e66755cc05074b70c77e111fc # v1.2.0
        if: always()
        with:
          msg: 'style: apply pre-commit fixes [pre-commit.ci lite]'

  # Values shared by the build and release jobs, computed once.
  metadata:
    name: Build metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: gate
    if: needs.gate.outputs.run == 'true'
    outputs:
      artifact_suffix: ${{ steps.meta.outputs.artifact_suffix }}
      update_channel: ${{ steps.meta.outputs.update_channel }}
      is_beta: ${{ steps.meta.outputs.is_beta }}
      sign: ${{ steps.meta.outputs.sign }}
    steps:
      - name: Compute metadata
        id: meta
        shell: bash
        env:
          REF_NAME: ${{ github.head_ref || github.ref_name }}
          # Only a manual run signs (and so only a manual run can publish): several PRs
          # can land on main before one release is cut from it. Publishing implies signing:
          # the appcast pushes a release to every installed client, and an unsigned exe
          # loses UIAccess.
          SIGN: ${{ github.event_name == 'workflow_dispatch' && (inputs.sign_binaries == true || inputs.publish_release == true) }}
        run: |
          slug=$(printf '%s' "$REF_NAME" | tr -c 'a-zA-Z0-9' '-' | tr '[:upper:]' '[:lower:]' | cut -c1-20 | sed 's/-*$//')
          if [ "$REF_NAME" = "main" ]; then
            suffix=""; channel="Stable"; is_beta="false"
          else
            suffix="-$slug"; channel="Beta"; is_beta="true"
          fi
          {
            echo "artifact_suffix=$suffix"
            echo "update_channel=$channel"
            echo "is_beta=$is_beta"
            echo "sign=$SIGN"
          } >> "$GITHUB_OUTPUT"
          echo "branch=$REF_NAME slug=$slug channel=$channel sign=$SIGN"

  build-debug:
    name: Debug Build
    needs: [pre-commit, metadata]
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      ARTIFACT_SUFFIX: ${{ needs.metadata.outputs.artifact_suffix }}
      UPDATE_CHANNEL: ${{ needs.metadata.outputs.update_channel }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          # Per job: each restores a different package set (Release adds the portable
          # runtime packs, the MSI adds WiX), and a cache entry can't be updated once saved.
          key: nuget-${{ runner.os }}-${{ github.job }}-${{ hashFiles('**/packages.lock.json', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-${{ github.job }}-

      - name: Restore NuGet packages
        run: dotnet restore

      - name: Build Debug (exe only)
        run: .\build\build-complete.ps1 -Configuration Debug -ExeOnly -UpdateChannel $env:UPDATE_CHANNEL

      - name: Upload Debug artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Windows-Hinting-Debug${{ env.ARTIFACT_SUFFIX }}
          path: Windows-Hinting\bin\Debug\net10.0-windows\
          if-no-files-found: error

  # Release outputs are built, signed and packaged in separate jobs so that build code
  # (MSBuild, NuGet package targets, the WiX toolset) never runs in a job that holds the
  # code-signing credentials:
  #
  #   build-release ──> sign-binaries ──> build-msi ──> sign-msi
  #   (no secrets)      (signing env,     (no secrets)  (signing env,
  #                      no checkout)                    no checkout)
  #
  # The signing jobs check out no code: they only download artifacts, run the pinned
  # eSigner action and verify the result. They use the 'signing' environment on main and
  # 'signing-branch' (approval required) on other branches. When SIGN is false they're
  # skipped: the unsigned portable exes are published under the same artifact names, and
  # build-msi packages the Debug build instead (see there).
  build-release:
    name: Release Build
    needs: [pre-commit, metadata]
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      ARTIFACT_SUFFIX: ${{ needs.metadata.outputs.artifact_suffix }}
      UPDATE_CHANNEL: ${{ needs.metadata.outputs.update_channel }}
      SIGN: ${{ needs.metadata.outputs.sign }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          # Per job: each restores a different package set (Release adds the portable
          # runtime packs, the MSI adds WiX), and a cache entry can't be updated once saved.
          key: nuget-${{ runner.os }}-${{ github.job }}-${{ hashFiles('**/packages.lock.json', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-${{ github.job }}-

      - name: Restore NuGet packages
        run: dotnet restore

      - name: Build Release exe
        run: .\build\build-complete.ps1 -Configuration Release -ExeOnly -UpdateChannel $env:UPDATE_CHANNEL

      # Settings come from Windows-Hinting/Properties/PublishProfiles/Portable-win-*.pubxml.
      - name: Build portable self-contained exes
        run: .\build\build-complete.ps1 -Portable -Runtime all -UpdateChannel $env:UPDATE_CHANNEL

      - name: Stage portable exes under their release names
        run: |
          $out = New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\portable"
          foreach ($rid in 'win-x64', 'win-x86') {
            Copy-Item "Windows-Hinting\bin-portable\publish\$rid\Windows-Hinting.exe" `
              (Join-Path $out "Windows-Hinting-Portable-$rid.exe")
          }
          Get-ChildItem $out | ForEach-Object { Write-Host "  $($_.Name)" }

      # Inputs for the signing job.
      - name: Upload unsigned app build
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-app
          # The portable publish leaves RID-specific output in win-x64\ and win-x86\;
          # the MSI doesn't ship it (Components.wxs), so don't upload it either.
          path: |
            Windows-Hinting\bin\Release\net10.0-windows\
            !Windows-Hinting\bin\Release\net10.0-windows\win-x64\
            !Windows-Hinting\bin\Release\net10.0-windows\win-x86\
          if-no-files-found: error
          retention-days: 1

      - name: Upload unsigned portable exes
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-portable
          path: ${{ runner.temp }}\portable\
          if-no-files-found: error
          retention-days: 1

      # Unsigned runs publish the portable exes straight from here.
      - name: Upload Portable x64 artifact (unsigned)
        if: env.SIGN != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Windows-Hinting-Portable-win-x64${{ env.ARTIFACT_SUFFIX }}
          path: ${{ runner.temp }}\portable\Windows-Hinting-Portable-win-x64.exe
          if-no-files-found: error

      - name: Upload Portable x86 artifact (unsigned)
        if: env.SIGN != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Windows-Hinting-Portable-win-x86${{ env.ARTIFACT_SUFFIX }}
          path: ${{ runner.temp }}\portable\Windows-Hinting-Portable-win-x86.exe
          if-no-files-found: error

  sign-binaries:
    name: Sign app and portable exes
    needs: [metadata, build-release]
    if: needs.metadata.outputs.sign == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    environment: ${{ github.ref == 'refs/heads/main' && 'signing' || 'signing-branch' }}
    env:
      ARTIFACT_SUFFIX: ${{ needs.metadata.outputs.artifact_suffix }}
    steps:
      - name: Download unsigned app build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-app
          path: app

      - name: Download unsigned portable exes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-portable
          path: portable

      # All four files go through one batch_sign call.
      - name: Stage files for signing
        run: |
          New-Item -ItemType Directory -Force to-sign, signed | Out-Null
          Copy-Item app\Windows-Hinting.exe, app\Windows-Hinting.dll, portable\*.exe to-sign\
          Get-ChildItem to-sign | ForEach-Object { Write-Host "  $($_.Name)" }

      - name: Sign with SSL.com eSigner
        uses: sslcom/esigner-codesign@cf5f6c1d38ad10f47e3ed9aca873f429b1a8d85b # v1.3.2
        with:
          command: batch_sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          dir_path: ${GITHUB_WORKSPACE}\to-sign
          output_path: ${GITHUB_WORKSPACE}\signed
          malware_block: true

      - name: Verify signatures and assemble outputs
        run: |
          $failed = $false
          foreach ($file in Get-ChildItem to-sign) {
            $signed = Join-Path signed $file.Name
            $sig = if (Test-Path $signed) { Get-AuthenticodeSignature $signed } else { $null }
            $status = if ($sig) { $sig.Status } else { 'Missing' }
            Write-Host ("  {0,-40} {1}  {2}" -f $file.Name, $status, $sig.SignerCertificate.Subject)
            if ($status -ne 'Valid') { $failed = $true }
          }
          if ($failed) { throw "Signing verification failed" }

          Copy-Item signed\Windows-Hinting.exe, signed\Windows-Hinting.dll app\ -Force
          Copy-Item signed\Windows-Hinting-Portable-*.exe portable\ -Force

      - name: Upload app build (signed)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-release
          path: app\
          if-no-files-found: error
          retention-days: 1

      - name: Upload Portable x64 artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Windows-Hinting-Portable-win-x64${{ env.ARTIFACT_SUFFIX }}
          path: portable\Windows-Hinting-Portable-win-x64.exe
          if-no-files-found: error

      - name: Upload Portable x86 artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Windows-Hinting-Portable-win-x86${{ env.ARTIFACT_SUFFIX }}
          path: portable\Windows-Hinting-Portable-win-x86.exe
          if-no-files-found: error

  # Two flavors, picked by SIGN:
  #  - signed runs package the signed Release build (uiAccess="true"), then sign-msi signs
  #    the MSI; this is the only MSI that is ever released.
  #  - unsigned runs package the Debug build (uiAccess="false"), so the installer can be
  #    tested from any push or PR without a signed publish. A Release exe can't be used
  #    there: Windows refuses to start an unsigned exe that asks for UIAccess.
  build-msi:
    name: Build MSI
    needs: [metadata, build-debug, build-release, sign-binaries]
    if: |
      !cancelled() && (
        (needs.metadata.outputs.sign == 'true' && needs.sign-binaries.result == 'success') ||
        (needs.metadata.outputs.sign != 'true' && needs.build-debug.result == 'success'))
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      ARTIFACT_SUFFIX: ${{ needs.metadata.outputs.artifact_suffix }}
      SIGN: ${{ needs.metadata.outputs.sign }}
      MSI_CONFIGURATION: ${{ needs.metadata.outputs.sign == 'true' && 'Release' || 'Debug' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          # Per job: each restores a different package set (Release adds the portable
          # runtime packs, the MSI adds WiX), and a cache entry can't be updated once saved.
          key: nuget-${{ runner.os }}-${{ github.job }}-${{ hashFiles('**/packages.lock.json', 'global.json') }}
          restore-keys: nuget-${{ runner.os }}-${{ github.job }}-

      # Put the app output where the installer's ProjectReference expects it for
      # MSI_CONFIGURATION.
      - name: Download signed Release app build
        if: env.SIGN == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-release
          path: Windows-Hinting\bin\Release\net10.0-windows

      - name: Download Debug app build
        if: env.SIGN != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Windows-Hinting-Debug${{ env.ARTIFACT_SUFFIX }}
          path: Windows-Hinting\bin\Debug\net10.0-windows

      - name: Verify app signatures before packaging
        if: env.SIGN == 'true'
        run: |
          foreach ($name in 'Windows-Hinting.exe', 'Windows-Hinting.dll') {
            $sig = Get-AuthenticodeSignature "Windows-Hinting\bin\Release\net10.0-windows\$name"
            Write-Host "  $name : $($sig.Status)"
            if ($sig.Status -ne 'Valid') { throw "$name is not validly signed ($($sig.Status))" }
          }

      # -InstallerOnly builds with BuildProjectReferences=false, so the app is NOT rebuilt
      # through the installer's ProjectReference (that would replace the signed binaries).
      - name: Build MSI
        run: .\build\build-complete.ps1 -Configuration $env:MSI_CONFIGURATION -InstallerOnly

      - name: Verify app signatures after packaging
        if: env.SIGN == 'true'
        run: |
          foreach ($name in 'Windows-Hinting.exe', 'Windows-Hinting.dll') {
            $sig = Get-AuthenticodeSignature "Windows-Hinting\bin\Release\net10.0-windows\$name"
            if ($sig.Status -ne 'Valid') { throw "$name was overwritten during the MSI build ($($sig.Status))" }
          }

      - name: Upload unsigned MSI
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-msi
          path: Windows-Hinting.Installer\bin\Release\en-US\Windows-Hinting.msi
          if-no-files-found: error
          retention-days: 1

      # Named apart from the signed installer so the two can't be mistaken for each other.
      - name: Upload Debug MSI artifact (unsigned)
        if: env.SIGN != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Windows-Hinting-Installer-Debug${{ env.ARTIFACT_SUFFIX }}
          path: Windows-Hinting.Installer\bin\Debug\en-US\Windows-Hinting.msi
          if-no-files-found: error

  sign-msi:
    name: Sign MSI
    needs: [metadata, build-msi]
    if: ${{ !cancelled() && needs.build-msi.result == 'success' && needs.metadata.outputs.sign == 'true' }}
    runs-on: windows-latest
    timeout-minutes: 15
    environment: ${{ github.ref == 'refs/heads/main' && 'signing' || 'signing-branch' }}
    env:
      ARTIFACT_SUFFIX: ${{ needs.metadata.outputs.artifact_suffix }}
    steps:
      - name: Download unsigned MSI
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned-msi
          path: msi

      - name: Sign MSI with SSL.com eSigner
        uses: sslcom/esigner-codesign@cf5f6c1d38ad10f47e3ed9aca873f429b1a8d85b # v1.3.2
        with:
          command: sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          file_path: ${GITHUB_WORKSPACE}\msi\Windows-Hinting.msi
          malware_block: true
          override: true

      - name: Verify MSI signature
        run: |
          $sig = Get-AuthenticodeSignature msi\Windows-Hinting.msi
          Write-Host "  Windows-Hinting.msi : $($sig.Status)  $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "MSI signature verification failed ($($sig.Status))" }

      - name: Upload MSI artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Windows-Hinting-Installer${{ env.ARTIFACT_SUFFIX }}
          path: msi\Windows-Hinting.msi
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release/tag, delete the rolling beta tag
    needs: [metadata, build-debug, build-release, sign-binaries, build-msi, sign-msi]
    timeout-minutes: 20
    # Holds the NetSparkle update-signing key: 'release' on main, 'release-branch'
    # (approval required) for a manual beta release from another branch.
    environment: ${{ github.ref == 'refs/heads/main' && 'release' || 'release-branch' }}
    env:
      ARTIFACT_SUFFIX: ${{ needs.metadata.outputs.artifact_suffix }}
      UPDATE_CHANNEL: ${{ needs.metadata.outputs.update_channel }}
      IS_BETA: ${{ needs.metadata.outputs.is_beta }}
    # Publish a release only from a manual run with publish_release=true (pushes, main
    # included, never publish):
    #  - on main                                               => stable channel (tag v<ver>)
    #  - on any other branch                                   => beta channel (rolling 'beta' tag)
    # Never from an unsigned build (publish_release turns signing on in metadata).
    # (Don't let other 'skipped' needs skip this job.)
    if: |
      !cancelled() && !failure() && needs.metadata.outputs.sign == 'true' &&
        github.event_name == 'workflow_dispatch' && inputs.publish_release == true

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute release names
        run: |
          if [ "$IS_BETA" = "false" ]; then
            echo "RELEASE_TAG=v${BUILD_VERSION}"                               >> "$GITHUB_ENV"
            echo "APPCAST_INSTALLER_NAME=appcast-installer"                    >> "$GITHUB_ENV"
            echo "APPCAST_PORTABLE_X64_NAME=appcast-portable-win-x64"          >> "$GITHUB_ENV"
            echo "APPCAST_PORTABLE_X86_NAME=appcast-portable-win-x86"          >> "$GITHUB_ENV"
            echo "APPCAST_URL_PREFIX=https://github.com/${{ github.repository }}/releases/download/v${BUILD_VERSION}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_TAG=beta"                                            >> "$GITHUB_ENV"
            echo "APPCAST_INSTALLER_NAME=appcast-installer-beta"               >> "$GITHUB_ENV"
            echo "APPCAST_PORTABLE_X64_NAME=appcast-portable-win-x64-beta"     >> "$GITHUB_ENV"
            echo "APPCAST_PORTABLE_X86_NAME=appcast-portable-win-x86-beta"     >> "$GITHUB_ENV"
            echo "APPCAST_URL_PREFIX=https://github.com/${{ github.repository }}/releases/download/beta" >> "$GITHUB_ENV"
          fi
        shell: bash

      # Stable only: one set of notes feeds both the GitHub release body and the
      # in-app update dialog (embedded in the signed appcast via --change-log-path).
      # Beta keeps GitHub's own generated notes and shows none in the app for now.
      - name: Generate release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cp .github/release-body-header.md release-body.md
          [ "$IS_BETA" = "true" ] && exit 0

          # The new release doesn't exist yet, so "latest" is the previous stable
          # one (prereleases are never latest). Passing it explicitly stops GitHub
          # guessing the start of the range.
          prev=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName 2>/dev/null || true)
          echo "PREV_STABLE_TAG=${prev}" >> "$GITHUB_ENV"
          args=(-f tag_name="$RELEASE_TAG" -f target_commitish="$GITHUB_SHA")
          [ -n "$prev" ] && args+=(-f previous_tag_name="$prev")
          gh api -X POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" "${args[@]}" -q .body > notes-github.md

          { echo; cat notes-github.md; } >> release-body.md

          # In-app copy: drop the author/PR-link suffixes, New Contributors and the
          # Full Changelog link (links don't open in the update dialog), then escape
          # & < > so PR-title markup is shown as text and never flips NetSparkle's
          # renderer from Markdown into raw-HTML mode.
          mkdir -p changelog
          notes="changelog/${BUILD_VERSION}.md"
          sed -E -e 's/ by @[^ ]+ in https:\/\/github\.com\/[^ ]+$//' \
                 -e '/^\*\*Full Changelog\*\*/d' notes-github.md \
            | awk '/^## New Contributors/ { skip = 1; next } /^## / { skip = 0 } !skip' \
            | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' -e 's/>/\&gt;/g' \
            | cat -s > "$notes"
          if ! grep -q '^\* ' "$notes"; then
            echo "Maintenance release with no user-facing changes." > "$notes"
          fi
          echo "In-app release notes:"; cat "$notes"
        shell: bash

      - name: Download Debug build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Windows-Hinting-Debug${{ env.ARTIFACT_SUFFIX }}
          path: artifacts/Windows-Hinting-Debug

      - name: Zip Debug build
        run: cd artifacts && zip -r Windows-Hinting-Debug.zip Windows-Hinting-Debug/

      - name: Download Portable x64 build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Windows-Hinting-Portable-win-x64${{ env.ARTIFACT_SUFFIX }}
          path: artifacts

      - name: Download Portable x86 build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Windows-Hinting-Portable-win-x86${{ env.ARTIFACT_SUFFIX }}
          path: artifacts

      - name: Download MSI installer
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: Windows-Hinting-Installer${{ env.ARTIFACT_SUFFIX }}
          path: artifacts

      - name: Setup .NET (for NetSparkle CLI)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      # Exact version from dotnet-tools.json: this job holds the update-signing key.
      - name: Install NetSparkle AppCastGenerator
        run: dotnet tool restore

      - name: Stage update artifacts
        env:
          NETSPARKLE_ED25519_PRIVATE_KEY: ${{ secrets.NETSPARKLE_ED25519_PRIVATE_KEY }}
          NETSPARKLE_ED25519_PUBLIC_KEY:  ${{ secrets.NETSPARKLE_ED25519_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${NETSPARKLE_ED25519_PRIVATE_KEY:-}" ] || [ -z "${NETSPARKLE_ED25519_PUBLIC_KEY:-}" ]; then
            echo "::warning::NETSPARKLE_ED25519_PRIVATE_KEY and/or NETSPARKLE_ED25519_PUBLIC_KEY secrets are not set. Skipping appcast generation."
            echo "APPCAST_SKIPPED=true" >> "$GITHUB_ENV"
            exit 0
          fi

          mkdir -p appcast-work/installer
          mkdir -p appcast-work/portable-x64
          mkdir -p appcast-work/portable-x86

          cp artifacts/Windows-Hinting.msi                       appcast-work/installer/
          cp artifacts/Windows-Hinting-Portable-win-x64.exe      appcast-work/portable-x64/
          cp artifacts/Windows-Hinting-Portable-win-x86.exe      appcast-work/portable-x86/

        shell: bash

      - name: Generate signed appcasts
        if: env.APPCAST_SKIPPED != 'true'
        env:
          BUILD_VERSION: ${{ env.BUILD_VERSION }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # NetSparkle's AppCastGenerator is documented to read BOTH keys
          # (base64) from env vars SparklePrivateKey and SparklePublicKey.
          # In practice, on a clean Linux runner it still falls through to the
          # disk-based key lookup
          # (~/.local/share/netsparkle/NetSparkle_Ed25519.{priv,pub}) and fails
          # with:
          #   "File does not exist: .../NetSparkle_Ed25519.pub
          #    Skipped generating signature. Generate keys with --generate-keys"
          # As a reliable workaround we ALSO materialize the keys to that
          # disk location below before invoking the generator. Both are kept
          # so signing works regardless of which path the tool takes.
          SparklePrivateKey: ${{ secrets.NETSPARKLE_ED25519_PRIVATE_KEY }}
          SparklePublicKey:  ${{ secrets.NETSPARKLE_ED25519_PUBLIC_KEY }}
        run: |
          set -euo pipefail

          version="${BUILD_VERSION}"
          base="${APPCAST_URL_PREFIX}"

          # Materialize the Ed25519 keys to the on-disk location NetSparkle
          # AppCastGenerator falls back to when env vars aren't honored.
          # The secrets are stored as base64 strings; write them verbatim.
          if [ -n "${SparklePrivateKey:-}" ] && [ -n "${SparklePublicKey:-}" ]; then
            key_dir="${HOME}/.local/share/netsparkle"
            mkdir -p "${key_dir}"
            # printf avoids trailing newline differences across shells.
            printf '%s' "${SparklePrivateKey}" > "${key_dir}/NetSparkle_Ed25519.priv"
            printf '%s' "${SparklePublicKey}"  > "${key_dir}/NetSparkle_Ed25519.pub"
            chmod 600 "${key_dir}/NetSparkle_Ed25519.priv"
            chmod 644 "${key_dir}/NetSparkle_Ed25519.pub"
          fi

          gen() {
            local input_dir="$1"
            local ext="$2"
            local download_url="$3"
            local out_name="$4"

            dotnet netsparkle-generate-appcast \
              --product-name "Windows-Hinting" \
              --appcast-output-directory appcast-out \
              --binaries "${input_dir}" \
              --file-extract-version=false \
              --file-version "${version}" \
              --search-binary-subdirectories false \
              --ext "${ext}" \
              --base-url "${download_url}" \
              --output-file-name "${out_name}" \
              --signature-file-extension signature \
              --change-log-path changelog \
              "${reparse[@]}"
          }

          mkdir -p appcast-out

          # Stable appcasts are cumulative: seed each with the previous stable
          # release's appcast so the update dialog shows notes for every version
          # newer than the installed one, not just the latest. Keep the newest
          # 19 old items (plus the new one). Beta stays single-item for now.
          reparse=()
          if [ "$IS_BETA" = "false" ] && [ -n "${PREV_STABLE_TAG:-}" ]; then
            reparse=(--reparse-existing)
            for name in "${APPCAST_INSTALLER_NAME}" "${APPCAST_PORTABLE_X64_NAME}" "${APPCAST_PORTABLE_X86_NAME}"; do
              gh release download "${PREV_STABLE_TAG}" --repo "$GITHUB_REPOSITORY" \
                --pattern "${name}.xml" --dir appcast-out --clobber \
                || echo "::warning::No ${name}.xml on ${PREV_STABLE_TAG}; that appcast starts fresh."
            done
            for f in appcast-out/*.xml; do
              [ -e "$f" ] || continue
              python3 - "$f" <<'PY'
          import sys, xml.etree.ElementTree as ET
          ET.register_namespace("sparkle", "http://www.andymatuschak.org/xml-namespaces/sparkle")
          path = sys.argv[1]
          tree = ET.parse(path)
          channel = tree.getroot().find("channel")
          for item in channel.findall("item")[19:]:  # items are newest-first
              channel.remove(item)
          tree.write(path, encoding="utf-8", xml_declaration=True)
          PY
            done
          fi

          if [ -z "${SparklePrivateKey:-}" ] || [ -z "${SparklePublicKey:-}" ]; then
            echo "::error::SparklePrivateKey and/or SparklePublicKey env vars are empty; appcast signatures would not be generated. Set the NETSPARKLE_ED25519_PRIVATE_KEY and NETSPARKLE_ED25519_PUBLIC_KEY repo secrets (base64)."
            exit 1
          fi

          gen appcast-work/installer     msi "${base}" "${APPCAST_INSTALLER_NAME}"
          gen appcast-work/portable-x64  exe "${base}" "${APPCAST_PORTABLE_X64_NAME}"
          gen appcast-work/portable-x86  exe "${base}" "${APPCAST_PORTABLE_X86_NAME}"

          ls -la appcast-out

          for name in "${APPCAST_INSTALLER_NAME}" "${APPCAST_PORTABLE_X64_NAME}" "${APPCAST_PORTABLE_X86_NAME}"; do
            sig="appcast-out/${name}.xml.signature"
            if [ ! -s "${sig}" ]; then
              echo "::error::Expected signature file '${sig}' was not generated. Verify NETSPARKLE_ED25519_PRIVATE_KEY is a valid base64 Ed25519 private key."
              exit 1
            fi
          done

          cp "appcast-out/${APPCAST_INSTALLER_NAME}.xml"       "artifacts/${APPCAST_INSTALLER_NAME}.xml"
          cp "appcast-out/${APPCAST_PORTABLE_X64_NAME}.xml"    "artifacts/${APPCAST_PORTABLE_X64_NAME}.xml"
          cp "appcast-out/${APPCAST_PORTABLE_X86_NAME}.xml"    "artifacts/${APPCAST_PORTABLE_X86_NAME}.xml"

          # NetSparkle (Strict security mode) refuses the appcast unless the
          # matching .signature file is present next to the .xml on the server.
          cp "appcast-out/${APPCAST_INSTALLER_NAME}.xml.signature"     "artifacts/${APPCAST_INSTALLER_NAME}.xml.signature"
          cp "appcast-out/${APPCAST_PORTABLE_X64_NAME}.xml.signature"  "artifacts/${APPCAST_PORTABLE_X64_NAME}.xml.signature"
          cp "appcast-out/${APPCAST_PORTABLE_X86_NAME}.xml.signature"  "artifacts/${APPCAST_PORTABLE_X86_NAME}.xml.signature"
        shell: bash

      # For rolling beta releases, delete the existing release and tag so a
      # fresh release is created on the current commit. Without this, GitHub
      # keeps the original tag target (so Source code zips still reflect the
      # old commit) and the release's published_at timestamp is never updated.
      - name: Delete existing beta release and tag
        if: env.IS_BETA == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ env.RELEASE_TAG }}"
          # Delete release (ignore if it doesn't exist)
          gh release delete "$tag" --yes --repo "${{ github.repository }}" || true
          # Delete tag ref (ignore if it doesn't exist)
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/$tag" || true
        shell: bash

      - name: Create GitHub release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: ${{ env.RELEASE_TAG }}
          commit: ${{ github.sha }}
          name: ${{ env.IS_BETA == 'true' && format('beta (build {0})', env.BUILD_VERSION) || format('v{0}', env.BUILD_VERSION) }}
          # Stable: notes are already in release-body.md (Generate release notes).
          # Beta: GitHub appends its generated notes after the Downloads header.
          generateReleaseNotes: ${{ env.IS_BETA == 'true' }}
          prerelease: ${{ env.IS_BETA == 'true' || inputs.prerelease || false }}
          makeLatest: ${{ env.IS_BETA != 'true' && !(inputs.prerelease || false) }}
          allowUpdates: false
          removeArtifacts: false
          bodyFile: release-body.md
          artifacts: |
            artifacts/Windows-Hinting-Debug.zip
            artifacts/Windows-Hinting-Portable-win-x64.exe
            artifacts/Windows-Hinting-Portable-win-x86.exe
            artifacts/Windows-Hinting.msi
            artifacts/${{ env.APPCAST_INSTALLER_NAME }}.xml
            artifacts/${{ env.APPCAST_PORTABLE_X64_NAME }}.xml
            artifacts/${{ env.APPCAST_PORTABLE_X86_NAME }}.xml
            artifacts/${{ env.APPCAST_INSTALLER_NAME }}.xml.signature
            artifacts/${{ env.APPCAST_PORTABLE_X64_NAME }}.xml.signature
            artifacts/${{ env.APPCAST_PORTABLE_X86_NAME }}.xml.signature
