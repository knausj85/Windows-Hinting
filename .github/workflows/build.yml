name: Build

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:
    inputs:
      sign_binaries:
        description: "Sign Release/Portable/MSI binaries with SSL.com eSigner"
        type: boolean
        default: true
      publish_release:
        description: "Publish a GitHub Release (main => stable 'v<ver>' tag; other branches => rolling 'beta' tag)"
        type: boolean
        default: false
      prerelease:
        description: "Mark the published release as prerelease (ignored for beta, which is always a prerelease)"
        type: boolean
        default: true

permissions:
  contents: write

env:
  BUILD_VERSION: 0.1.${{ github.run_number }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  lint:
    name: Pre-commit Lint
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore NuGet packages
        run: dotnet restore

      - name: Install PSScriptAnalyzer
        run: Install-Module -Name PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

      - name: Auto-fix and commit
        if: failure() && github.event_name == 'pull_request'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: auto-fix pre-commit hook violations"

  build-debug:
    name: Debug Build
    needs: lint
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Compute metadata
        run: |
          $refName = "${{ github.ref_name }}"
          if ("${{ github.head_ref }}" -ne "") {
            $refName = "${{ github.head_ref }}"
          }
          $slug = $refName -replace '[^a-zA-Z0-9]', '-'
          $slug = $slug.ToLower()
          if ($slug.Length -gt 20) {
            $slug = $slug.Substring(0, 20)
          }
          $slug = $slug.TrimEnd('-')
          Write-Host "Branch slug: $slug"
          echo "BRANCH_SLUG=$slug" >> $env:GITHUB_ENV
          if ($refName -eq "main") {
            echo "ARTIFACT_SUFFIX=" >> $env:GITHUB_ENV
            echo "UPDATE_CHANNEL=Stable" >> $env:GITHUB_ENV
          } else {
            echo "ARTIFACT_SUFFIX=-$slug" >> $env:GITHUB_ENV
            echo "UPDATE_CHANNEL=Beta" >> $env:GITHUB_ENV
          }

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install Visual Studio 2026 Build Tools
        shell: pwsh
        run: |
          Write-Host "Installing VS 2026 Build Tools..."
          choco install visualstudio2026buildtools --package-parameters "--add Microsoft.VisualStudio.Workload.MSBuildTools --add Microsoft.VisualStudio.Workload.NetCoreBuildTools --add Microsoft.VisualStudio.Workload.ManagedDesktopBuildTools --add Microsoft.VisualStudio.Workload.VCTools --add Microsoft.VisualStudio.Component.VC.Tools.x86.x64 --includeRecommended --quiet" -y --ignore-package-exit-codes=3010
          Write-Host "VS 2026 Build Tools installation completed"

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3
        with:
          vs-prerelease: true

      - name: Restore NuGet packages
        run: dotnet restore

      - name: Build Debug (exe only)
        env:
          UPDATE_CHANNEL: ${{ env.UPDATE_CHANNEL }}
        run: .\build\build-complete.ps1 -Configuration Debug -ExeOnly -UpdateChannel $env:UPDATE_CHANNEL

      - name: Clean Debug output
        run: |
          $outDir = "Windows-Hinting\bin\Debug\net10.0-windows"
          Remove-Item "$outDir\xunit.*" -Force -ErrorAction SilentlyContinue

      - name: Upload Debug artifact
        uses: actions/upload-artifact@v7
        with:
          name: Windows-Hinting-Debug${{ env.ARTIFACT_SUFFIX }}
          path: Windows-Hinting\bin\Debug\net10.0-windows\
          if-no-files-found: error

  build-release:
    name: Release Build + MSI
    needs: lint
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Compute metadata
        run: |
          $refName = "${{ github.ref_name }}"
          if ("${{ github.head_ref }}" -ne "") {
            $refName = "${{ github.head_ref }}"
          }
          $slug = $refName -replace '[^a-zA-Z0-9]', '-'
          $slug = $slug.ToLower()
          if ($slug.Length -gt 20) {
            $slug = $slug.Substring(0, 20)
          }
          $slug = $slug.TrimEnd('-')
          Write-Host "Branch slug: $slug"
          echo "BRANCH_SLUG=$slug" >> $env:GITHUB_ENV
          if ($refName -eq "main") {
            echo "ARTIFACT_SUFFIX=" >> $env:GITHUB_ENV
            echo "UPDATE_CHANNEL=Stable" >> $env:GITHUB_ENV
          } else {
            echo "ARTIFACT_SUFFIX=-$slug" >> $env:GITHUB_ENV
            echo "UPDATE_CHANNEL=Beta" >> $env:GITHUB_ENV
          }

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install Visual Studio 2026 Build Tools
        shell: pwsh
        run: |
          Write-Host "Installing VS 2026 Build Tools..."
          choco install visualstudio2026buildtools --package-parameters "--add Microsoft.VisualStudio.Workload.MSBuildTools --add Microsoft.VisualStudio.Workload.NetCoreBuildTools --add Microsoft.VisualStudio.Workload.ManagedDesktopBuildTools --add Microsoft.VisualStudio.Workload.VCTools --add Microsoft.VisualStudio.Component.VC.Tools.x86.x64 --includeRecommended --quiet" -y --ignore-package-exit-codes=3010
          Write-Host "VS 2026 Build Tools installation completed"

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3
        with:
          vs-prerelease: true

      - name: Install WiX Toolset
        # Version must match WixToolset.Sdk version in Windows-Hinting.Installer.wixproj
        run: dotnet tool install --global wix --version 6.0.2

      - name: Restore NuGet packages
        run: dotnet restore

      - name: Build Release exe
        run: .\build\build-complete.ps1 -Configuration Release -ExeOnly -UpdateChannel $env:UPDATE_CHANNEL

      - name: Stage Release binaries for signing
        if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && inputs.sign_binaries == true)
        run: |
          $outDir   = "$env:GITHUB_WORKSPACE\Windows-Hinting\bin\Release\net10.0-windows"
          $stageDir = "$env:GITHUB_WORKSPACE\to_be_signed_release"
          New-Item -ItemType Directory -Path $stageDir -Force | Out-Null
          Get-ChildItem -LiteralPath $stageDir -Force | Remove-Item -Recurse -Force
          foreach ($name in @('Windows-Hinting.exe','Windows-Hinting.dll')) {
            $src = Join-Path $outDir $name
            if (-not (Test-Path -LiteralPath $src)) { throw "File to sign not found: $src" }
            Copy-Item -LiteralPath $src -Destination (Join-Path $stageDir $name) -Force
          }
          Write-Host "Staged files for signing:"
          Get-ChildItem -LiteralPath $stageDir | ForEach-Object { Write-Host "  - $($_.Name)" }

      - name: Sign Release binaries with SSL.com eSigner
        if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && inputs.sign_binaries == true)
        uses: sslcom/esigner-codesign@develop
        with:
          command: batch_sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          dir_path: ${GITHUB_WORKSPACE}\to_be_signed_release
          output_path: ${GITHUB_WORKSPACE}\Windows-Hinting\bin\Release\net10.0-windows
          malware_block: true

      - name: Verify Release signatures and clean staging
        if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && inputs.sign_binaries == true)
        run: |
          $outDir   = "$env:GITHUB_WORKSPACE\Windows-Hinting\bin\Release\net10.0-windows"
          $stageDir = "$env:GITHUB_WORKSPACE\to_be_signed_release"
          Write-Host "--- Release Signature verification ---"
          foreach ($name in @('Windows-Hinting.exe','Windows-Hinting.dll')) {
            $dest = Join-Path $outDir $name
            if (-not (Test-Path -LiteralPath $dest)) {
              Write-Host "  ERROR: signed file missing: $dest"
              continue
            }
            $sig = Get-AuthenticodeSignature -FilePath $dest
            Write-Host "  File         : $dest"
            Write-Host "    Status       : $($sig.Status)"
            Write-Host "    StatusMessage: $($sig.StatusMessage)"
            if ($sig.SignerCertificate) {
              Write-Host "    Signer       : $($sig.SignerCertificate.Subject)"
              Write-Host "    Valid until  : $($sig.SignerCertificate.NotAfter)"
            } else {
              Write-Host "    Signer       : (none - file is unsigned)"
            }
          }
          Write-Host "--------------------------------------"
          Remove-Item -LiteralPath $stageDir -Recurse -Force -ErrorAction SilentlyContinue

      - name: Verify signatures BEFORE MSI build
        if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && inputs.sign_binaries == true)
        run: |
          $outDir = "$env:GITHUB_WORKSPACE\Windows-Hinting\bin\Release\net10.0-windows"
          Write-Host "--- Pre-MSI signature check ---"
          foreach ($name in @('Windows-Hinting.exe','Windows-Hinting.dll')) {
            $dest = Join-Path $outDir $name
            $sig  = Get-AuthenticodeSignature -FilePath $dest
            Write-Host "  $name : $($sig.Status) ($($sig.StatusMessage))"
            if ($sig.Status -ne 'Valid') {
              throw "Pre-MSI verification failed: $name is not validly signed (status: $($sig.Status))."
            }
          }
          Write-Host "-------------------------------"

      - name: Build MSI (packages the signed binaries)
        run: |
          # IMPORTANT: /p:BuildProjectReferences=false so msbuild does NOT rebuild the
          # Windows-Hinting project via its ProjectReference. Rebuilding would overwrite
          # the already-signed Windows-Hinting.exe / Windows-Hinting.dll with fresh
          # unsigned outputs, and WiX would then harvest those unsigned files into the MSI
          # (the signed MSI would contain an unsigned managed DLL).
          $InstallerProject = "Windows-Hinting.Installer\Windows-Hinting.Installer.wixproj"
          msbuild $InstallerProject `
            /p:Configuration=Release `
            /p:SignOutput=false `
            /p:BuildProjectReferences=false `
            /p:UpdateChannel=$env:UPDATE_CHANNEL `
            /nologo /v:minimal

      - name: Verify signatures AFTER MSI build
        if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && inputs.sign_binaries == true)
        run: |
          $outDir = "$env:GITHUB_WORKSPACE\Windows-Hinting\bin\Release\net10.0-windows"
          Write-Host "--- Post-MSI signature check ---"
          $failed = $false
          foreach ($name in @('Windows-Hinting.exe','Windows-Hinting.dll')) {
            $dest = Join-Path $outDir $name
            $sig  = Get-AuthenticodeSignature -FilePath $dest
            Write-Host "  $name : $($sig.Status) ($($sig.StatusMessage))"
            if ($sig.Status -ne 'Valid') {
              Write-Host "    ERROR: $name was stripped/overwritten during MSI build."
              $failed = $true
            }
          }
          Write-Host "--------------------------------"
          if ($failed) {
            throw "MSI build overwrote signed binaries. Check that /p:BuildProjectReferences=false is honored."
          }

      - name: Sign MSI with SSL.com eSigner
        if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && inputs.sign_binaries == true)
        uses: sslcom/esigner-codesign@develop
        with:
          command: sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          file_path: ${GITHUB_WORKSPACE}\Windows-Hinting.Installer\bin\Release\en-US\Windows-Hinting.msi
          malware_block: true
          override: true

      - name: Verify MSI signature
        if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && inputs.sign_binaries == true)
        run: |
          $msiPath = "$env:GITHUB_WORKSPACE\Windows-Hinting.Installer\bin\Release\en-US\Windows-Hinting.msi"
          Write-Host "--- MSI Signature verification ---"
          if (-not (Test-Path $msiPath)) {
            Write-Host "  ERROR: MSI not found at $msiPath"
          } else {
            $sig = Get-AuthenticodeSignature -FilePath $msiPath
            Write-Host "  Status       : $($sig.Status)"
            Write-Host "  StatusMessage: $($sig.StatusMessage)"
            if ($sig.SignerCertificate) {
              Write-Host "  Signer       : $($sig.SignerCertificate.Subject)"
              Write-Host "  Valid until  : $($sig.SignerCertificate.NotAfter)"
            } else {
              Write-Host "  Signer       : (none — MSI is unsigned)"
            }
          }
          Write-Host "----------------------------------"

      - name: Build portable self-contained exe for win-x64
        run: |
          # Clean bin/obj from MSI build to avoid conflicts
          Remove-Item "$env:GITHUB_WORKSPACE\Windows-Hinting\bin" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "$env:GITHUB_WORKSPACE\Windows-Hinting\obj" -Recurse -Force -ErrorAction SilentlyContinue

          $project = "Windows-Hinting\Windows-Hinting.csproj"
          $publishDir = "$env:GITHUB_WORKSPACE\Windows-Hinting\bin-portable\publish\win-x64"

          # Step 1: Restore with the specific RID (SelfContained so runtime packs are fetched)
          Write-Host "Restoring packages for win-x64..."
          dotnet restore $project -r win-x64 -p:SelfContained=true -p:PublishReadyToRun=true
          if ($LASTEXITCODE -ne 0) { throw "dotnet restore failed for win-x64 with exit code $LASTEXITCODE" }

          # Step 2: Use msbuild (Framework) to compile and generate COM interop
          # SelfContained=true so runtime packs are resolved for the subsequent publish step
          Write-Host "Building with msbuild to generate COM interop for win-x64..."
          msbuild $project `
            /p:Configuration=Release `
            /p:RuntimeIdentifier=win-x64 `
            /p:SelfContained=true `
            /p:ApplicationManifest=app.debug.manifest `
            /p:PortableBuild=true `
            /p:UpdateChannel=$env:UPDATE_CHANNEL `
            /nologo /v:minimal

          if ($LASTEXITCODE -ne 0) { throw "msbuild compile failed for win-x64 with exit code $LASTEXITCODE" }

          # Step 3: Use msbuild /t:Publish for self-contained single-file (reuses COM interop from step 2)
          Write-Host "Publishing self-contained single-file package for win-x64..."
          msbuild $project `
            /t:Publish `
            /p:Configuration=Release `
            /p:RuntimeIdentifier=win-x64 `
            /p:ApplicationManifest=app.debug.manifest `
            /p:SelfContained=true `
            /p:PublishSingleFile=true `
            /p:IncludeNativeLibrariesForSelfExtract=true `
            /p:EnableCompressionInSingleFile=true `
            /p:PublishReadyToRun=true `
            /p:DebugType=embedded `
            /p:PublishDir=$publishDir\ `
            /p:PortableBuild=true `
            /p:UpdateChannel=$env:UPDATE_CHANNEL `
            /p:NoBuild=true `
            /nologo /v:minimal

          if ($LASTEXITCODE -ne 0) { throw "Portable x64 publish failed with exit code $LASTEXITCODE" }

          $exePath = Join-Path $publishDir "Windows-Hinting.exe"
          if (-not (Test-Path $exePath)) { throw "x64 exe not found at $exePath" }

          $exeSize = (Get-Item $exePath).Length / 1MB
          Write-Host "x64 portable exe published: $exePath ($($exeSize.ToString('0.0')) MB)"

      - name: Stage portable x64 binaries for signing
        if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && inputs.sign_binaries == true)
        run: |
          $outDir   = "$env:GITHUB_WORKSPACE\Windows-Hinting\bin-portable\publish\win-x64"
          $stageDir = "$env:GITHUB_WORKSPACE\to_be_signed_portable_x64"
          New-Item -ItemType Directory -Path $stageDir -Force | Out-Null
          Get-ChildItem -LiteralPath $stageDir -Force | Remove-Item -Recurse -Force

          $src = Join-Path $outDir "Windows-Hinting.exe"
          if (-not (Test-Path -LiteralPath $src)) { throw "File to sign not found: $src" }
          Copy-Item -LiteralPath $src -Destination (Join-Path $stageDir "Windows-Hinting.exe") -Force

          Write-Host "Staged x64 portable exe for signing:"
          Get-ChildItem -LiteralPath $stageDir | ForEach-Object { Write-Host "  - $($_.Name)" }

      - name: Sign portable x64 binaries with SSL.com eSigner
        if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && inputs.sign_binaries == true)
        uses: sslcom/esigner-codesign@develop
        with:
          command: batch_sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          dir_path: ${GITHUB_WORKSPACE}\to_be_signed_portable_x64
          output_path: ${GITHUB_WORKSPACE}\Windows-Hinting\bin-portable\publish\win-x64
          malware_block: true

      - name: Verify portable x64 signature and clean staging
        if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && inputs.sign_binaries == true)
        run: |
          $outDir   = "$env:GITHUB_WORKSPACE\Windows-Hinting\bin-portable\publish\win-x64"
          $stageDir = "$env:GITHUB_WORKSPACE\to_be_signed_portable_x64"
          $exePath  = Join-Path $outDir "Windows-Hinting.exe"

          Write-Host "--- x64 Portable Signature verification ---"
          if (-not (Test-Path -LiteralPath $exePath)) {
            throw "Signed x64 exe missing: $exePath"
          }

          $sig = Get-AuthenticodeSignature -FilePath $exePath
          Write-Host "  Status       : $($sig.Status)"
          Write-Host "  StatusMessage: $($sig.StatusMessage)"
          if ($sig.SignerCertificate) {
            Write-Host "  Signer       : $($sig.SignerCertificate.Subject)"
            Write-Host "  Valid until  : $($sig.SignerCertificate.NotAfter)"
          } else {
            Write-Host "  Signer       : (none - file is unsigned)"
          }
          Write-Host "-------------------------------------------"

          if ($sig.Status -ne 'Valid') {
            throw "x64 portable exe signature invalid (status: $($sig.Status))"
          }

          Remove-Item -LiteralPath $stageDir -Recurse -Force -ErrorAction SilentlyContinue

      - name: Stage portable x64 exe for release
        run: |
          $publishDir = "$env:GITHUB_WORKSPACE\Windows-Hinting\bin-portable\publish\win-x64"
          $exeOut     = "$env:GITHUB_WORKSPACE\Windows-Hinting-Portable-win-x64.exe"

          if (Test-Path -LiteralPath $exeOut) { Remove-Item -LiteralPath $exeOut -Force }

          # Only include Windows-Hinting.exe, exclude .pdb
          $exePath = Join-Path $publishDir "Windows-Hinting.exe"
          Copy-Item -LiteralPath $exePath -Destination $exeOut -Force
          Write-Host "Portable x64 exe staged: $exeOut"

      - name: Upload Portable x64 artifact
        uses: actions/upload-artifact@v7
        with:
          name: Windows-Hinting-Portable-win-x64${{ env.ARTIFACT_SUFFIX }}
          path: Windows-Hinting-Portable-win-x64.exe
          if-no-files-found: error

      - name: Build portable self-contained exe for win-x86
        run: |
          # Clean bin/obj again for x86 build
          Remove-Item "$env:GITHUB_WORKSPACE\Windows-Hinting\bin" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item "$env:GITHUB_WORKSPACE\Windows-Hinting\obj" -Recurse -Force -ErrorAction SilentlyContinue

          $project = "Windows-Hinting\Windows-Hinting.csproj"
          $publishDir = "$env:GITHUB_WORKSPACE\Windows-Hinting\bin-portable\publish\win-x86"

          # Step 1: Restore with the specific RID (SelfContained so runtime packs are fetched)
          Write-Host "Restoring packages for win-x86..."
          dotnet restore $project -r win-x86 -p:SelfContained=true -p:PublishReadyToRun=true
          if ($LASTEXITCODE -ne 0) { throw "dotnet restore failed for win-x86 with exit code $LASTEXITCODE" }

          # Step 2: Use msbuild (Framework) to compile and generate COM interop
          # SelfContained=true so runtime packs are resolved for the subsequent publish step
          Write-Host "Building with msbuild to generate COM interop for win-x86..."
          msbuild $project `
            /p:Configuration=Release `
            /p:RuntimeIdentifier=win-x86 `
            /p:SelfContained=true `
            /p:ApplicationManifest=app.debug.manifest `
            /p:PortableBuild=true `
            /p:UpdateChannel=$env:UPDATE_CHANNEL `
            /nologo /v:minimal

          if ($LASTEXITCODE -ne 0) { throw "msbuild compile failed for win-x86 with exit code $LASTEXITCODE" }

          # Step 3: Use msbuild /t:Publish for self-contained single-file (reuses COM interop from step 2)
          Write-Host "Publishing self-contained single-file package for win-x86..."
          msbuild $project `
            /t:Publish `
            /p:Configuration=Release `
            /p:RuntimeIdentifier=win-x86 `
            /p:ApplicationManifest=app.debug.manifest `
            /p:SelfContained=true `
            /p:PublishSingleFile=true `
            /p:IncludeNativeLibrariesForSelfExtract=true `
            /p:EnableCompressionInSingleFile=true `
            /p:PublishReadyToRun=true `
            /p:DebugType=embedded `
            /p:PublishDir=$publishDir\ `
            /p:PortableBuild=true `
            /p:UpdateChannel=$env:UPDATE_CHANNEL `
            /p:NoBuild=true `
            /nologo /v:minimal

          if ($LASTEXITCODE -ne 0) { throw "Portable x86 publish failed with exit code $LASTEXITCODE" }

          $exePath = Join-Path $publishDir "Windows-Hinting.exe"
          if (-not (Test-Path $exePath)) { throw "x86 exe not found at $exePath" }

          $exeSize = (Get-Item $exePath).Length / 1MB
          Write-Host "x86 portable exe published: $exePath ($($exeSize.ToString('0.0')) MB)"

      - name: Stage portable x86 binaries for signing
        if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && inputs.sign_binaries == true)
        run: |
          $outDir   = "$env:GITHUB_WORKSPACE\Windows-Hinting\bin-portable\publish\win-x86"
          $stageDir = "$env:GITHUB_WORKSPACE\to_be_signed_portable_x86"
          New-Item -ItemType Directory -Path $stageDir -Force | Out-Null
          Get-ChildItem -LiteralPath $stageDir -Force | Remove-Item -Recurse -Force

          $src = Join-Path $outDir "Windows-Hinting.exe"
          if (-not (Test-Path -LiteralPath $src)) { throw "File to sign not found: $src" }
          Copy-Item -LiteralPath $src -Destination (Join-Path $stageDir "Windows-Hinting.exe") -Force

          Write-Host "Staged x86 portable exe for signing:"
          Get-ChildItem -LiteralPath $stageDir | ForEach-Object { Write-Host "  - $($_.Name)" }

      - name: Sign portable x86 binaries with SSL.com eSigner
        if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && inputs.sign_binaries == true)
        uses: sslcom/esigner-codesign@develop
        with:
          command: batch_sign
          username: ${{ secrets.ES_USERNAME }}
          password: ${{ secrets.ES_PASSWORD }}
          credential_id: ${{ secrets.CREDENTIAL_ID }}
          totp_secret: ${{ secrets.ES_TOTP_SECRET }}
          dir_path: ${GITHUB_WORKSPACE}\to_be_signed_portable_x86
          output_path: ${GITHUB_WORKSPACE}\Windows-Hinting\bin-portable\publish\win-x86
          malware_block: true

      - name: Verify portable x86 signature and clean staging
        if: (github.ref == 'refs/heads/main' && github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && inputs.sign_binaries == true)
        run: |
          $outDir   = "$env:GITHUB_WORKSPACE\Windows-Hinting\bin-portable\publish\win-x86"
          $stageDir = "$env:GITHUB_WORKSPACE\to_be_signed_portable_x86"
          $exePath  = Join-Path $outDir "Windows-Hinting.exe"

          Write-Host "--- x86 Portable Signature verification ---"
          if (-not (Test-Path -LiteralPath $exePath)) {
            throw "Signed x86 exe missing: $exePath"
          }

          $sig = Get-AuthenticodeSignature -FilePath $exePath
          Write-Host "  Status       : $($sig.Status)"
          Write-Host "  StatusMessage: $($sig.StatusMessage)"
          if ($sig.SignerCertificate) {
            Write-Host "  Signer       : $($sig.SignerCertificate.Subject)"
            Write-Host "  Valid until  : $($sig.SignerCertificate.NotAfter)"
          } else {
            Write-Host "  Signer       : (none - file is unsigned)"
          }
          Write-Host "-------------------------------------------"

          if ($sig.Status -ne 'Valid') {
            throw "x86 portable exe signature invalid (status: $($sig.Status))"
          }

          Remove-Item -LiteralPath $stageDir -Recurse -Force -ErrorAction SilentlyContinue

      - name: Stage portable x86 exe for release
        run: |
          $publishDir = "$env:GITHUB_WORKSPACE\Windows-Hinting\bin-portable\publish\win-x86"
          $exeOut     = "$env:GITHUB_WORKSPACE\Windows-Hinting-Portable-win-x86.exe"

          if (Test-Path -LiteralPath $exeOut) { Remove-Item -LiteralPath $exeOut -Force }

          # Only include Windows-Hinting.exe, exclude .pdb
          $exePath = Join-Path $publishDir "Windows-Hinting.exe"
          Copy-Item -LiteralPath $exePath -Destination $exeOut -Force
          Write-Host "Portable x86 exe staged: $exeOut"

      - name: Upload Portable x86 artifact
        uses: actions/upload-artifact@v7
        with:
          name: Windows-Hinting-Portable-win-x86${{ env.ARTIFACT_SUFFIX }}
          path: Windows-Hinting-Portable-win-x86.exe
          if-no-files-found: error

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v7
        with:
          name: Windows-Hinting-Installer${{ env.ARTIFACT_SUFFIX }}
          path: Windows-Hinting.Installer\bin\Release\en-US\Windows-Hinting.msi
          if-no-files-found: error

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-debug, build-release]
    # Publish a release when:
    #  - Direct pushes to main                                 => stable channel (tag v<ver>)
    #  - Manual dispatch on main with publish_release=true     => stable channel (tag v<ver>)
    #  - Manual dispatch on any non-main branch with
    #    publish_release=true                                  => beta channel (rolling 'beta' tag)
    if: |
      (github.ref == 'refs/heads/main' && github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_release == true)

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Compute release metadata
        run: |
          refName="${{ github.ref_name }}"
          if [ "${{ github.head_ref }}" != "" ]; then
            refName="${{ github.head_ref }}"
          fi
          slug=$(echo "$refName" | tr -c 'a-zA-Z0-9' '-' | tr '[:upper:]' '[:lower:]' | cut -c1-20 | sed 's/-*$//')
          echo "BRANCH_SLUG=$slug" >> "$GITHUB_ENV"

          if [ "$refName" = "main" ]; then
            echo "UPDATE_CHANNEL=Stable"                                       >> "$GITHUB_ENV"
            echo "ARTIFACT_SUFFIX="                                            >> "$GITHUB_ENV"
            echo "RELEASE_TAG=v${BUILD_VERSION}"                               >> "$GITHUB_ENV"
            echo "APPCAST_INSTALLER_NAME=appcast-installer"                    >> "$GITHUB_ENV"
            echo "APPCAST_PORTABLE_X64_NAME=appcast-portable-win-x64"          >> "$GITHUB_ENV"
            echo "APPCAST_PORTABLE_X86_NAME=appcast-portable-win-x86"          >> "$GITHUB_ENV"
            echo "APPCAST_URL_PREFIX=https://github.com/${{ github.repository }}/releases/download/v${BUILD_VERSION}" >> "$GITHUB_ENV"
            echo "IS_BETA=false"                                               >> "$GITHUB_ENV"
          else
            echo "UPDATE_CHANNEL=Beta"                                         >> "$GITHUB_ENV"
            echo "ARTIFACT_SUFFIX=-$slug"                                      >> "$GITHUB_ENV"
            echo "RELEASE_TAG=beta"                                            >> "$GITHUB_ENV"
            echo "APPCAST_INSTALLER_NAME=appcast-installer-beta"               >> "$GITHUB_ENV"
            echo "APPCAST_PORTABLE_X64_NAME=appcast-portable-win-x64-beta"     >> "$GITHUB_ENV"
            echo "APPCAST_PORTABLE_X86_NAME=appcast-portable-win-x86-beta"     >> "$GITHUB_ENV"
            echo "APPCAST_URL_PREFIX=https://github.com/${{ github.repository }}/releases/download/beta" >> "$GITHUB_ENV"
            echo "IS_BETA=true"                                                >> "$GITHUB_ENV"
          fi
        shell: bash

      - name: Download Debug build
        uses: actions/download-artifact@v8
        with:
          name: Windows-Hinting-Debug${{ env.ARTIFACT_SUFFIX }}
          path: artifacts/Windows-Hinting-Debug

      - name: Zip Debug build
        run: cd artifacts && zip -r Windows-Hinting-Debug.zip Windows-Hinting-Debug/

      - name: Download Portable x64 build
        uses: actions/download-artifact@v8
        with:
          name: Windows-Hinting-Portable-win-x64${{ env.ARTIFACT_SUFFIX }}
          path: artifacts

      - name: Download Portable x86 build
        uses: actions/download-artifact@v8
        with:
          name: Windows-Hinting-Portable-win-x86${{ env.ARTIFACT_SUFFIX }}
          path: artifacts

      - name: Download MSI installer
        uses: actions/download-artifact@v8
        with:
          name: Windows-Hinting-Installer${{ env.ARTIFACT_SUFFIX }}
          path: artifacts

      - name: Setup .NET (for NetSparkle CLI)
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Install NetSparkle AppCastGenerator
        run: dotnet tool install --global NetSparkleUpdater.Tools.AppCastGenerator --version 2.8.*

      - name: Stage update artifacts
        env:
          NETSPARKLE_ED25519_PRIVATE_KEY: ${{ secrets.NETSPARKLE_ED25519_PRIVATE_KEY }}
          NETSPARKLE_ED25519_PUBLIC_KEY:  ${{ secrets.NETSPARKLE_ED25519_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${NETSPARKLE_ED25519_PRIVATE_KEY:-}" ] || [ -z "${NETSPARKLE_ED25519_PUBLIC_KEY:-}" ]; then
            echo "::warning::NETSPARKLE_ED25519_PRIVATE_KEY and/or NETSPARKLE_ED25519_PUBLIC_KEY secrets are not set. Skipping appcast generation."
            echo "APPCAST_SKIPPED=true" >> "$GITHUB_ENV"
            exit 0
          fi

          mkdir -p appcast-work/installer
          mkdir -p appcast-work/portable-x64
          mkdir -p appcast-work/portable-x86

          cp artifacts/Windows-Hinting.msi                       appcast-work/installer/
          cp artifacts/Windows-Hinting-Portable-win-x64.exe      appcast-work/portable-x64/
          cp artifacts/Windows-Hinting-Portable-win-x86.exe      appcast-work/portable-x86/

        shell: bash

      - name: Generate signed appcasts
        if: env.APPCAST_SKIPPED != 'true'
        env:
          BUILD_VERSION: ${{ env.BUILD_VERSION }}
          # NetSparkle's AppCastGenerator is documented to read BOTH keys
          # (base64) from env vars SparklePrivateKey and SparklePublicKey.
          # In practice, on a clean Linux runner it still falls through to the
          # disk-based key lookup
          # (~/.local/share/netsparkle/NetSparkle_Ed25519.{priv,pub}) and fails
          # with:
          #   "File does not exist: .../NetSparkle_Ed25519.pub
          #    Skipped generating signature. Generate keys with --generate-keys"
          # As a reliable workaround we ALSO materialize the keys to that
          # disk location below before invoking the generator. Both are kept
          # so signing works regardless of which path the tool takes.
          SparklePrivateKey: ${{ secrets.NETSPARKLE_ED25519_PRIVATE_KEY }}
          SparklePublicKey:  ${{ secrets.NETSPARKLE_ED25519_PUBLIC_KEY }}
        run: |
          set -euo pipefail

          version="${BUILD_VERSION}"
          base="${APPCAST_URL_PREFIX}"

          # Materialize the Ed25519 keys to the on-disk location NetSparkle
          # AppCastGenerator falls back to when env vars aren't honored.
          # The secrets are stored as base64 strings; write them verbatim.
          if [ -n "${SparklePrivateKey:-}" ] && [ -n "${SparklePublicKey:-}" ]; then
            key_dir="${HOME}/.local/share/netsparkle"
            mkdir -p "${key_dir}"
            # printf avoids trailing newline differences across shells.
            printf '%s' "${SparklePrivateKey}" > "${key_dir}/NetSparkle_Ed25519.priv"
            printf '%s' "${SparklePublicKey}"  > "${key_dir}/NetSparkle_Ed25519.pub"
            chmod 600 "${key_dir}/NetSparkle_Ed25519.priv"
            chmod 644 "${key_dir}/NetSparkle_Ed25519.pub"
          fi

          gen() {
            local input_dir="$1"
            local ext="$2"
            local download_url="$3"
            local out_name="$4"

            netsparkle-generate-appcast \
              --product-name "Windows-Hinting" \
              --appcast-output-directory appcast-out \
              --binaries "${input_dir}" \
              --file-extract-version=false \
              --file-version "${version}" \
              --search-binary-subdirectories false \
              --ext "${ext}" \
              --base-url "${download_url}" \
              --output-file-name "${out_name}" \
              --release-notes-url "https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG}" \
              --signature-file-extension signature
          }

          mkdir -p appcast-out

          if [ -z "${SparklePrivateKey:-}" ] || [ -z "${SparklePublicKey:-}" ]; then
            echo "::error::SparklePrivateKey and/or SparklePublicKey env vars are empty; appcast signatures would not be generated. Set the NETSPARKLE_ED25519_PRIVATE_KEY and NETSPARKLE_ED25519_PUBLIC_KEY repo secrets (base64)."
            exit 1
          fi

          gen appcast-work/installer     msi "${base}" "${APPCAST_INSTALLER_NAME}"
          gen appcast-work/portable-x64  exe "${base}" "${APPCAST_PORTABLE_X64_NAME}"
          gen appcast-work/portable-x86  exe "${base}" "${APPCAST_PORTABLE_X86_NAME}"

          ls -la appcast-out

          for name in "${APPCAST_INSTALLER_NAME}" "${APPCAST_PORTABLE_X64_NAME}" "${APPCAST_PORTABLE_X86_NAME}"; do
            sig="appcast-out/${name}.xml.signature"
            if [ ! -s "${sig}" ]; then
              echo "::error::Expected signature file '${sig}' was not generated. Verify NETSPARKLE_ED25519_PRIVATE_KEY is a valid base64 Ed25519 private key."
              exit 1
            fi
          done

          cp "appcast-out/${APPCAST_INSTALLER_NAME}.xml"       "artifacts/${APPCAST_INSTALLER_NAME}.xml"
          cp "appcast-out/${APPCAST_PORTABLE_X64_NAME}.xml"    "artifacts/${APPCAST_PORTABLE_X64_NAME}.xml"
          cp "appcast-out/${APPCAST_PORTABLE_X86_NAME}.xml"    "artifacts/${APPCAST_PORTABLE_X86_NAME}.xml"

          # NetSparkle (Strict security mode) refuses the appcast unless the
          # matching .signature file is present next to the .xml on the server.
          cp "appcast-out/${APPCAST_INSTALLER_NAME}.xml.signature"     "artifacts/${APPCAST_INSTALLER_NAME}.xml.signature"
          cp "appcast-out/${APPCAST_PORTABLE_X64_NAME}.xml.signature"  "artifacts/${APPCAST_PORTABLE_X64_NAME}.xml.signature"
          cp "appcast-out/${APPCAST_PORTABLE_X86_NAME}.xml.signature"  "artifacts/${APPCAST_PORTABLE_X86_NAME}.xml.signature"
        shell: bash

      # For rolling beta releases, delete the existing release and tag so a
      # fresh release is created on the current commit. Without this, GitHub
      # keeps the original tag target (so Source code zips still reflect the
      # old commit) and the release's published_at timestamp is never updated.
      - name: Delete existing beta release and tag
        if: env.IS_BETA == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ env.RELEASE_TAG }}"
          # Delete release (ignore if it doesn't exist)
          gh release delete "$tag" --yes --repo "${{ github.repository }}" || true
          # Delete tag ref (ignore if it doesn't exist)
          gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/$tag" || true
        shell: bash

      - name: Create GitHub release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.RELEASE_TAG }}
          commit: ${{ github.sha }}
          name: ${{ env.IS_BETA == 'true' && format('beta (build {0})', env.BUILD_VERSION) || format('v{0}', env.BUILD_VERSION) }}
          generateReleaseNotes: true
          prerelease: ${{ env.IS_BETA == 'true' || inputs.prerelease || false }}
          makeLatest: ${{ env.IS_BETA != 'true' && !(inputs.prerelease || false) }}
          allowUpdates: false
          removeArtifacts: false
          body: |
            ## Downloads

              | Asset | Description |
              |---|---|
              | **Windows-Hinting-Portable-win-x64.exe** | Self-contained portable x64 build — signed single-file executable. No .NET runtime required. No UIAccess (hints won't appear above e.g. the start menu). Download and run. |
              | **Windows-Hinting-Portable-win-x86.exe** | Self-contained portable x86 build — signed single-file executable. No .NET runtime required. No UIAccess (hints won't appear above e.g. the start menu). Download and run. |
              | **Windows-Hinting-Debug.zip** | Debug build — **unsigned**, for diagnostics/testing only. Extract and run `Windows-Hinting.exe`. Requires [.NET 10 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/10.0). |
              | **Windows-Hinting.msi** | Installer — fully signed (installer, executable, and managed DLL). Provides UIAccess support so hints appear above e.g. the start menu. Requires [.NET 10 Desktop Runtime](https://dotnet.microsoft.com/download/dotnet/10.0). |
          artifacts: |
            artifacts/Windows-Hinting-Debug.zip
            artifacts/Windows-Hinting-Portable-win-x64.exe
            artifacts/Windows-Hinting-Portable-win-x86.exe
            artifacts/Windows-Hinting.msi
            artifacts/${{ env.APPCAST_INSTALLER_NAME }}.xml
            artifacts/${{ env.APPCAST_PORTABLE_X64_NAME }}.xml
            artifacts/${{ env.APPCAST_PORTABLE_X86_NAME }}.xml
            artifacts/${{ env.APPCAST_INSTALLER_NAME }}.xml.signature
            artifacts/${{ env.APPCAST_PORTABLE_X64_NAME }}.xml.signature
            artifacts/${{ env.APPCAST_PORTABLE_X86_NAME }}.xml.signature
